<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="theme-color"
    content="#f97316"
  >

  <link
    rel="icon"
    href="./assets/starup-icon.png"
  >

  <title>StarUp Demo</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>
  <header class="header">
    <div class="brand">
      <img
        src="./assets/starup-icon.png"
        alt=""
      >

      <div>
        <h1>StarUp</h1>
        <span>Live demo</span>
      </div>
    </div>

    <div class="live">
      <span></span>
      Démo temps réel
    </div>
  </header>

  <main class="layout">
    <aside>
      <div class="aside-title">
        MONITORS
        <span>1</span>
      </div>

      <button class="monitor active">
        <div>
          <i></i>
          <strong>Compteur live</strong>
        </div>

        <small>
          JSON · toutes les 2s
        </small>
      </button>
    </aside>

    <section class="content">
      <div class="toolbar">
        <div>
          <div class="title">
            <h2>Compteur live</h2>
            <span>Opérationnel</span>
          </div>

          <p>
            https://demo.starup.local/metric
          </p>

          <small id="last-check">
            Dernier check : maintenant
          </small>
        </div>

        <button
          class="primary"
          id="check-button"
        >
          Vérifier maintenant
        </button>
      </div>

      <div class="controls">
        <div class="selector">
          <button class="active">24h</button>
          <button>7j</button>
          <button>30j</button>
        </div>

        <div class="selector">
          <button class="active">Valeur</button>
          <button>Croissance / jour</button>
        </div>

        <div class="selector" id="shapes">
          <button
            data-shape="smooth"
            class="active"
          >
            Lisse
          </button>

          <button data-shape="straight">
            Droite
          </button>

          <button data-shape="step">
            Escalier
          </button>
        </div>
      </div>

      <div class="cards">
        <article class="card featured">
          <span>Valeur actuelle</span>
          <strong id="current-value">1000</strong>
        </article>

        <article class="card">
          <span>Delta dernier check</span>
          <strong id="delta">+1</strong>
        </article>

        <article class="card">
          <span>Mesures</span>
          <strong id="samples">1</strong>
        </article>
      </div>

      <article class="panel">
        <div>
          <h3>Évolution</h3>
          <p>
            Données simulées en direct dans le navigateur.
          </p>
        </div>

        <svg
          id="chart"
          viewBox="0 0 1000 360"
          preserveAspectRatio="none"
        >
          <g id="grid"></g>
          <polyline
            id="line"
            fill="none"
            stroke="#f97316"
            stroke-width="4"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
      </article>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
