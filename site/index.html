<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f97316"
  >

  <link
    rel="icon"
    href="./assets/starup-icon.png"
  >

  <title>StarUp Test Target</title>

  <style>
    :root {
      font-family:
        Inter,
        system-ui,
        sans-serif;

      color: #e7edf5;
      background: #0b0f14;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
    }

    main {
      width: min(720px, 100%);
      margin: auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    header img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    h1,
    h2 {
      margin: 0;
    }

    header p,
    .help {
      color: #8896a7;
    }

    .value {
      margin-bottom: 20px;
      padding: 22px;

      border: 1px solid
        rgba(249, 115, 22, .3);

      border-radius: 10px;

      background: #111820;
    }

    #current-value {
      display: block;

      margin-top: 8px;

      color: #fb923c;

      font-size: 42px;
      font-weight: 800;
    }

    section {
      margin-bottom: 16px;
      padding: 20px;

      border: 1px solid #26313f;
      border-radius: 10px;

      background: #111820;
    }

    code {
      display: block;

      margin: 8px 0 14px;
      padding: 10px;

      overflow-x: auto;

      border-radius: 7px;

      background: #090d12;
      color: #ffbd80;
    }

    a {
      color: #fb923c;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <img
        src="./assets/starup-icon.png"
        alt="StarUp"
      >

      <div>
        <h1>StarUp Test Target</h1>

        <p>
          Une cible HTML et une cible JSON
          pour tester StarUp.
        </p>
      </div>
    </header>

    <div class="value">
      Valeur actuelle

      <strong id="current-value">
        ...
      </strong>
    </div>

    <section>
      <h2>JSON</h2>

      <p class="help">
        URL
      </p>

      <code id="json-url"></code>

      <p class="help">
        JSON Path
      </p>

      <code>value</code>

      <a
        href="./json/value.json"
        target="_blank"
      >
        Voir le JSON
      </a>
    </section>

    <section>
      <h2>HTML</h2>

      <p class="help">
        URL
      </p>

      <code id="html-url"></code>

      <p class="help">
        Sélecteur CSS
      </p>

      <code>#metric-value</code>

      <a
        href="./html/"
        target="_blank"
      >
        Voir le HTML
      </a>
    </section>
  </main>

  <script>
    const base =
      location.origin +
      location.pathname.replace(
        /\/$/,
        ""
      );

    document.querySelector(
      "#json-url"
    ).textContent =
      `${base}/json/value.json`;

    document.querySelector(
      "#html-url"
    ).textContent =
      `${base}/html/`;

    async function refresh() {
      const response =
        await fetch(
          `./json/value.json?t=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

      const data =
        await response.json();

      document.querySelector(
        "#current-value"
      ).textContent =
        data.value.toLocaleString(
          "fr-FR"
        );
    }

    refresh();

    setInterval(
      refresh,
      30000
    );
  </script>
</body>
</html>
